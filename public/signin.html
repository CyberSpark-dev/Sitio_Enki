<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Enki.com</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1b2a4e; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Montserrat', sans-serif; }
        .card { width: 100%; max-width: 400px; border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="card p-4">
        <div class="text-center mb-4">
            <h3 class="text-primary fw-bold">{ ENKI }</h3>
            <h4>Registro de Usuario</h4>
        </div>
        
        <form id="formRegistro">
            <div class="mb-3">
                <label>Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
                <label>Usuario (Nick)</label>
                <input type="text" class="form-control" id="usuario" required>
            </div>
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">Registrarse</button>
            <a href="index.html" class="btn btn-outline-secondary w-100">Volver al Inicio</a>
        </form>

        <div class="text-center mt-3">
            <small>¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></small>
        </div>
    </div>

    <script>
        const formulario = document.getElementById('formRegistro');

        formulario.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue sola

            // Capturamos los datos
            const datosUsuario = {
                nombre: document.getElementById('nombre').value,
                usuario: document.getElementById('usuario').value,
                password: document.getElementById('password').value
            };

            try {
                // Enviamos los datos al servidor
                const peticion = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosUsuario)
                });

                const respuesta = await peticion.json();

                // LOGICA DE ALERTAS
                if (peticion.status === 200) {
                    // CASO 1: ÉXITO
                    alert('¡USUARIO CREADO CON ÉXITO! 🎉\nAhora inicia sesión.');
                    window.location.href = 'login.html';
                } 
                else if (peticion.status === 409) {
                    // CASO 2: USUARIO DUPLICADO
                    alert('CUIDADO: Ya tienes una cuenta con este usuario.\nIntenta con otro nombre o inicia sesión.');
                } 
                else {
                    // CASO 3: OTRO ERROR
                    alert('Error: ' + respuesta.msg);
                }

            } catch (error) {
                console.error('Error de conexión:', error);
                alert('No se pudo conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
